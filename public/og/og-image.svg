<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="paper-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#e5e0d8"/>
    </pattern>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#fdfbf7"/>
  <rect width="1200" height="630" fill="url(#paper-dots)"/>

  <g transform="translate(-40 38)">
    <!-- Hand-drawn chat bubble (left side, 15% smaller) -->
    <g transform="translate(17.2 48.2) scale(0.85)">
      <path d="M 235 112 C 340 88, 445 106, 468 164 C 490 222, 480 320, 428 346 C 390 366, 315 358, 297 368 L 224 438 L 266 368 C 240 344, 172 286, 168 214 C 164 142, 186 126, 235 112 Z"
            fill="#fdf8c1" stroke="#2d2d2d" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>

      <g fill="#2d2d2d">
        <circle cx="285" cy="217" r="19"/>
        <circle cx="388" cy="217" r="19"/>
      </g>
      <path d="M 312 288 Q 340 310 376 288" fill="none" stroke="#2d2d2d" stroke-width="24" stroke-linecap="round"/>

      <g fill="#ff4d4d" opacity="0.85">
        <path d="M 258 256 q 13 12 0 26 q -13 -14 0 -26 z" />
        <path d="M 418 256 q 13 12 0 26 q -13 -14 0 -26 z" />
      </g>
    </g>

    <!-- Title (right side) -->
    <text x="850" y="203" text-anchor="middle" font-family="'Patrick Hand','Kalam','Comic Sans MS','Segoe Print',cursive,sans-serif" font-size="93" font-weight="700" fill="#2d2d2d">JustChatting</text>

    <!-- Tagline -->
    <text x="850" y="307" text-anchor="middle" font-family="'Patrick Hand','Kalam','Comic Sans MS','Segoe Print',cursive,sans-serif" font-size="44" font-weight="600" letter-spacing="0.5" fill="#5a5449">Real-time chat with friends</text>

    <!-- Underline doodle -->
    <path d="M 685 367 Q 870 395 1085 363" fill="none" stroke="#ff4d4d" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>